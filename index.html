<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Specialty Drug PA Automation &mdash; Fusion Hub Services</title>
<style>
/* Fusion Hub Services — theme & layout */

:root{
  --navy:#0f2a3e; --navy-2:#153a54; --teal:#0f8a8a; --teal-2:#0b6e6e;
  --bg:#f4f7f9; --card:#ffffff; --border:#dde5ea;
  --text:#1c2b33; --muted:#5c7280; --muted-2:#8ea0ac;
  --green:#1c8a5a; --green-bg:#e7f6ee;
  --amber:#a56a00; --amber-bg:#fdf3dd;
  --red:#b23b3b; --red-bg:#fbe9e9;
  --blue:#265d8a; --blue-bg:#e9f1fa;
  --radius:10px; --radius-sm:6px;
  --shadow:0 1px 2px rgba(15,42,62,.06), 0 1px 8px rgba(15,42,62,.05);
  --focus:#0f8a8a;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
}
a{color:var(--teal-2)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}

/* ---------- Topbar ---------- */
.topbar{
  background:var(--navy); color:#fff; padding:0 24px; height:56px;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.2px}
.brand .mark{
  width:26px; height:26px; border-radius:7px; background:var(--teal);
  display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff;
}
.brand .sub{font-weight:400; color:#9fb4c2; font-size:12px; margin-left:6px}
.nav-tabs{display:flex; gap:4px}
.nav-tabs a{
  color:#cfe0e8; text-decoration:none; padding:8px 12px; border-radius:7px; font-size:13px;
}
.nav-tabs a.active, .nav-tabs a:hover{background:rgba(255,255,255,.1); color:#fff}
.env-tag{
  font-size:11px; color:#9fb4c2; border:1px solid rgba(255,255,255,.2); padding:3px 8px; border-radius:20px;
}

/* ---------- Layout ---------- */
.container{max-width:1180px; margin:0 auto; padding:24px}
.page-title{font-size:20px; font-weight:700; margin:0 0 4px}
.page-sub{color:var(--muted); font-size:13px; margin:0 0 20px}

/* ---------- Cards / panels ---------- */
.panel{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); margin-bottom:16px;
}
.panel-head{
  padding:14px 18px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.panel-head h2{font-size:14px; margin:0; font-weight:700}
.panel-body{padding:18px}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  border-radius:var(--radius-sm); font-size:13px; font-weight:600; padding:8px 14px;
  border:1px solid var(--border); background:#fff; color:var(--text);
  transition:background .12s ease, border-color .12s ease;
}
.btn:hover{background:#f2f6f8}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn-primary{background:var(--teal); border-color:var(--teal); color:#fff}
.btn-primary:hover{background:var(--teal-2)}
.btn-ghost{background:transparent; border-color:transparent}
.btn-ghost:hover{background:#eef2f4}
.btn-sm{padding:5px 10px; font-size:12px}
.btn-danger-outline{color:var(--red); border-color:#eecece}
.btn-export{
  background:var(--navy-2); border-color:var(--navy-2); color:#fff;
}
.btn-export:hover{background:var(--navy)}
.btn-export.is-loading{opacity:.7; cursor:progress}
.btn-export.is-done{background:var(--green); border-color:var(--green)}

/* ---------- Badges / pills ---------- */
.badge{
  display:inline-flex; align-items:center; font-size:9px; font-weight:800;
  padding:2px 7px; border-radius:4px; text-transform:uppercase; letter-spacing:.5px;
  vertical-align:middle; margin-left:5px;
}
.badge-happy {background:var(--green-bg); color:var(--green)}
.badge-stp   {background:var(--blue-bg);  color:var(--blue)}
.badge-update{background:var(--amber-bg); color:var(--amber)}
.badge-reject{background:var(--red-bg);   color:var(--red)}
.badge-neutral{background:#eef2f4; color:var(--muted)}

.pill{font-size:11px; padding:2px 8px; border-radius:20px; font-weight:600}
.pill-low{background:var(--amber-bg); color:var(--amber)}
.pill-flag{background:var(--red-bg); color:var(--red)}
.pill-ok{background:var(--green-bg); color:var(--green)}

/* ---------- Work queue table ---------- */
table{width:100%; border-collapse:collapse}
.queue-table th{
  text-align:left; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.6px;
  color:var(--muted-2); padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap;
}
.queue-table td{ padding:14px 14px; border-bottom:1px solid var(--border); vertical-align:middle }
.queue-table tr:last-child td{border-bottom:none}
.queue-row:hover td{background:#f7fafc}

/* Case column */
.td-case{ min-width:130px }
.case-id{
  font-weight:800; font-size:13px; color:var(--teal-2); text-decoration:none; letter-spacing:.2px;
}
.case-id:hover{text-decoration:underline}

/* Patient column */
.td-patient{ min-width:160px }
.td-main{ font-size:13px; font-weight:600; color:var(--text); margin-bottom:2px }
.td-sub{ font-size:11px; color:var(--muted); margin-top:2px }

/* Therapy column */
.td-therapy{ min-width:260px }
.td-therapy .td-main{ font-weight:600 }

/* Received */
.td-recv{ white-space:nowrap; font-size:12px; color:var(--muted); min-width:110px }

/* Docs count */
.td-docs{ text-align:center }
.doc-count{
  display:inline-flex; align-items:center; justify-content:center;
  width:22px; height:22px; border-radius:50%; background:#eef2f4;
  font-size:11px; font-weight:700; color:var(--muted);
}

/* Status */
.td-status{ white-space:nowrap; min-width:90px }
.status-btn{
  display:inline-block; font-size:10px; font-weight:800; padding:4px 10px;
  border-radius:5px; letter-spacing:.4px; text-transform:uppercase; border:1px solid;
}
.status-new    { background:#f0f4f8; border-color:#d0dce8; color:var(--muted) }
.status-running{ background:var(--blue-bg); border-color:#bdd4e8; color:var(--blue) }
.status-review { background:var(--amber-bg); border-color:#e8d090; color:var(--amber) }
.status-done   { background:var(--green-bg); border-color:#bce0cc; color:var(--green) }
.open-arrow{
  margin-left:8px; font-size:11px; color:var(--teal-2); font-weight:700; text-decoration:none;
}
.open-arrow:hover{text-decoration:underline}

/* Actions */
.td-actions{ white-space:nowrap }
.row-actions{display:flex; gap:6px; justify-content:flex-end; align-items:center}

.muted{color:var(--muted)}
.small{font-size:12px}

/* ---------- Case workspace ---------- */
.breadcrumb{
  display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
  color:var(--muted); text-decoration:none; margin-bottom:10px;
}
.breadcrumb:hover{color:var(--teal-2)}
.case-header{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:16px}
.case-header h1{font-size:20px; margin:0 0 6px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.case-meta{color:var(--muted); font-size:13px}
.case-subactions{display:flex; gap:14px; margin-top:8px}
.case-actions{display:flex; gap:8px; flex-wrap:wrap}
.btn-link{
  background:none; border:none; padding:0; font-size:12px; color:var(--teal-2); font-weight:600;
  cursor:pointer; text-decoration:underline; text-underline-offset:2px;
}
.btn-link.danger{color:var(--red)}
.btn-link:hover{opacity:.75}
.badge-neutral{background:#eef2f4; color:var(--muted)}

.case-grid{display:grid; grid-template-columns:340px 1fr; gap:16px; align-items:start}
@media (max-width:900px){ .case-grid{grid-template-columns:1fr} }

.eyebrow{
  font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
  color:var(--muted-2); margin-bottom:6px;
}
.doc-icon-policy{background:var(--blue-bg); color:var(--blue); font-size:9px}

/* ---------------- Hero (pre-run) card ---------------- */
.hero{text-align:center; padding:40px 28px}
.hero-icon{
  width:48px; height:48px; border-radius:50%; background:#fff4e9; color:#c97a1f;
  display:flex; align-items:center; justify-content:center; font-size:20px; margin:0 auto 16px;
}
.hero h2{margin:0 0 12px; font-size:19px}
.hero p{max-width:520px; margin:0 auto 20px; color:var(--muted); font-size:13px; line-height:1.6}
.hero p a{color:var(--teal-2); font-weight:600}
.hero-baseline{margin-top:14px; font-size:11px; color:var(--muted-2); font-family:monospace}

.kv{display:grid; grid-template-columns:120px 1fr; gap:6px 12px; font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}

/* ---------- Pipeline ---------- */
.pipeline{display:flex; flex-direction:column; gap:0}
.stage{
  display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px dashed var(--border);
}
.stage:last-child{border-bottom:none}
.stage-icon{
  width:22px; height:22px; border-radius:50%; flex:none;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
  background:#eef2f4; color:var(--muted-2);
}
.stage.done .stage-icon{background:var(--green-bg); color:var(--green)}
.stage.skipped .stage-icon{background:#eef2f4; color:var(--muted-2)}
.stage.running .stage-icon{background:var(--blue-bg); color:var(--blue)}
.stage-name{font-weight:600; font-size:13px}
.stage-result{color:var(--muted); font-size:12px}
.stage-meta{margin-left:auto; text-align:right; color:var(--muted-2); font-size:11px}
.stage.skipped .stage-name, .stage.skipped .stage-result{color:var(--muted-2)}

/* ---------- Payer form ---------- */
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px}
@media (max-width:600px){ .form-grid{grid-template-columns:1fr} }
.field{border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 10px; background:#fafcfd}
.field label{display:block; font-size:11px; color:var(--muted); margin-bottom:3px}
.field .val{font-size:13px; font-weight:600; min-height:16px}
.field .val.typing::after{content:"\258b"; animation:blink 1s step-end infinite; color:var(--teal)}
@keyframes blink{50%{opacity:0}}

/* ---------- Q&A / citations ---------- */
.qa{border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; margin-bottom:10px}
.qa .q{font-weight:600; font-size:13px; margin-bottom:6px}
.qa .a{font-size:13px}
.qa .a.missing{color:var(--amber); font-style:italic}
.qa .meta{display:flex; gap:8px; align-items:center; margin-top:8px; font-size:11px; color:var(--muted)}
.cite-tag{
  background:#eef6f6; color:var(--teal-2); border-radius:5px; padding:1px 6px; font-weight:700; font-size:10px;
}

/* ---------- Documents ---------- */
.doc-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border)}
.doc-row:last-child{border-bottom:none}
.doc-icon{width:30px; height:30px; border-radius:6px; background:#eef2f4; flex:none; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--muted)}
.doc-info{flex:1; min-width:0}
.doc-label{font-size:13px; font-weight:600}
.doc-sub{font-size:11px; color:var(--muted)}
.doc-actions{display:flex; gap:6px}

/* ---------- Assessment ---------- */
.assessment{border-radius:var(--radius); padding:16px 18px; margin-bottom:16px; border:1px solid var(--border)}
.assessment.approve{background:var(--green-bg); border-color:#bfe4cf}
.assessment.file{background:var(--blue-bg); border-color:#c6dcef}
.assessment.update{background:var(--amber-bg); border-color:#f0dca6}
.assessment.reject{background:var(--red-bg); border-color:#f0c7c7}
.assessment h3{margin:0 0 6px; font-size:15px}
.assessment p{margin:0; font-size:13px}

/* ---------- Receipt ---------- */
.receipt{text-align:center; padding:36px 20px}
.receipt .check{width:52px; height:52px; border-radius:50%; background:var(--green-bg); color:var(--green); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; font-size:24px}
.receipt h2{margin:0 0 6px}
.receipt .tracking{font-family:monospace; font-size:15px; background:#f2f6f8; display:inline-block; padding:6px 14px; border-radius:6px; margin:10px 0}
.receipt .stats{display:flex; gap:24px; justify-content:center; margin-top:18px}
.receipt .stat b{display:block; font-size:18px}
.receipt .stat span{font-size:11px; color:var(--muted)}

/* ---------- CRM ---------- */
.crm-layout{display:grid; grid-template-columns:220px 1fr; gap:16px}
@media (max-width:800px){ .crm-layout{grid-template-columns:1fr} }
.crm-side{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:10px}
.crm-side a{display:block; padding:9px 10px; border-radius:7px; text-decoration:none; color:var(--text); font-size:13px; font-weight:600}
.crm-side a.active, .crm-side a:hover{background:#eef6f6; color:var(--teal-2)}
.crm-tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:14px}
.crm-tabs button{background:none; border:none; padding:9px 14px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent}
.crm-tabs button.active{color:var(--navy); border-color:var(--teal)}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(15,42,62,.45); z-index:60;
  align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto;
}
.modal{
  background:var(--card); border-radius:var(--radius); width:100%; max-width:560px;
  box-shadow:0 12px 40px rgba(0,0,0,.25);
}
.modal .panel-head{border-radius:var(--radius) var(--radius) 0 0}
.field input, .field select{
  width:100%; border:1px solid var(--border); border-radius:5px; padding:6px 8px;
  font-size:13px; font-family:inherit; background:#fff; color:var(--text);
}
.field input:focus, .field select:focus{outline:2px solid var(--focus); outline-offset:1px}

/* ---------- Toast ---------- */
.toast-stack{position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:50}
.toast{
  background:var(--navy); color:#fff; padding:11px 16px; border-radius:8px; font-size:13px;
  box-shadow:0 6px 18px rgba(0,0,0,.18); min-width:220px;
}
.toast.error{background:var(--red)}
.toast.success{background:var(--green)}

/* ---------- Empty / misc ---------- */
.section-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin:18px 0 8px}
.divider{height:1px; background:var(--border); margin:14px 0}
.flex-between{display:flex; align-items:center; justify-content:space-between}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

</style>
</head>

/* runtime state per case (in-memory only, resets on page reload) */
const RUN = {}; // caseId -> { running, stageIdx, done, revealedQ, filledFields, finished, primaryDone }
function runState(id){
  if(!RUN[id]) RUN[id] = { running:false, stageIdx:-1, done:false, revealedQ:0, filledFields:0, finished:false, primaryDone:false };
  return RUN[id];
}
function resetCase(id){ RUN[id] = { running:false, stageIdx:-1, done:false, revealedQ:0, filledFields:0, finished:false, primaryDone:false }; }

/* ---------------- utils ---------------- */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtDate(iso){
  if(!iso) return "\u2014";
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
}
function badgeFor(scn){
  const cls = { HAPPY:"badge-happy", STP:"badge-stp", UPDATE:"badge-update", REJECT:"badge-reject" }[scn] || "badge-stp";
  return `<span class="badge ${cls}">${esc(scn)}</span>`;
}
function statusBadge(st){
  if(st.primaryDone) return `<span class="badge badge-happy">SUBMITTED</span>`;
  if(st.finished) return `<span class="badge badge-update">REVIEW</span>`;
  if(st.running) return `<span class="badge badge-stp">RUNNING</span>`;
  return `<span class="badge badge-neutral">NEW</span>`;
}
function verdictClass(v){ return {approve:"approve", file:"file", update:"update", reject:"reject"}[v] || "file"; }

let toastId = 0;
function toast(msg, kind){
  let stack = document.querySelector(".toast-stack");
  if(!stack){ stack = document.createElement("div"); stack.className="toast-stack"; document.body.appendChild(stack); }
  const id = "t"+(++toastId);
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " "+kind : "");
  el.id = id;
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .3s"; setTimeout(()=>el.remove(), 320); }, 4200);

}

async function confirmDeleteCase(caseId){
  const c = CASES[caseId];

function wireNewCaseModal(){
  const backdrop = document.getElementById("new-case-backdrop");
  const open = ()=>{ backdrop.style.display = "flex"; };
  const close = ()=>{ backdrop.style.display = "none"; };
  document.getElementById("btn-new-case").addEventListener("click", open);
  document.getElementById("new-case-close").addEventListener("click", close);
  document.getElementById("new-case-cancel").addEventListener("click", close);
  backdrop.addEventListener("click", (e)=>{ if(e.target===backdrop) close(); });
  document.getElementById("new-case-form").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const fields = Object.fromEntries(fd.entries());
    if(!fields.patientName || !fields.patientName.trim()){ toast("Patient name is required.", "error"); return; }
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true; submitBtn.textContent = "Adding\u2026";
    try{
      const c = await createCase(fields);
      toast(`${c.id} added to the work queue.`, "success");
      close();
      render();
    }catch(err){
      toast("Could not add referral: " + err.message, "error");
    }finally{
      submitBtn.disabled = false; submitBtn.textContent = "Add referral";
    }
  });
}

const NUMBER_WORDS = {1:"One",2:"Two",3:"Three",4:"Four",5:"Five",6:"Six",7:"Seven",8:"Eight",9:"Nine",10:"Ten"};

function pipelineSummary(c){
  const active = c.stages.filter(s=>s[3] !== "skipped").map(s=>s[0].toLowerCase());
  const n = active.length;
  const word = NUMBER_WORDS[n] || n;
  let list;
  if(active.length <= 1){
    list = active.join("");
  } else {
    list = active.slice(0,-1).join(", ") + ", and " + active[active.length-1];
  }
  return `${word} stage${n===1?'':'s'} will run against this referral: ${list}.`;
}

function firstName(full){ return String(full||"").split(" ")[0] || full; }

function findDoc(c, cite){ return c.documents.find(d=>d.cite===cite); }

function heroCard(c){
  const policyDoc = findDoc(c, "POL");
  const formDoc = findDoc(c, "FORM-B") || findDoc(c, "FORM-C");
  const policyLink = policyDoc ? `<a href="${esc(policyDoc.file)}" target="_blank" rel="noopener">${esc(c.policy.id)}</a>` : esc(c.policy.id);
  const formLink = formDoc ? `<a href="${esc(formDoc.file)}" target="_blank" rel="noopener">form ${esc(c.form.id)}</a>` : `form ${esc(c.form.id)}`;
  const formClause = c.form.completed
    ? `, and complete all ${c.form.fields} fields of ${formLink} \u2014 citing a source for every clinical answer`
    : `, and determine whether a payer form is required at all`;
  const baselineMatch = String(c.baseline||"").match(/[\d.]+\s*\S*/);
  const baselineText = baselineMatch ? baselineMatch[0] : c.baseline;

  return `
  <div class="panel"><div class="panel-body hero">
    <div class="hero-icon">\u26a1</div>
    <h2>Ready to work this request</h2>
    <p>The agent will read the ${c.documents.length} attached document${c.documents.length===1?'':'s'}, pull ${esc(firstName(c.patient.name))}'s record from the hub case management system, apply ${esc(c.payer.name)} policy ${policyLink}${formClause}.</p>
    <button class="btn btn-primary" id="btn-run-agent-hero">Run agent</button>
    <div class="hero-baseline">Manual baseline for this task: ~${esc(baselineText)} (illustrative)</div>
  </div></div>`;
}

function renderStages(c, st){
  return c.stages.map((s, i)=>{
    const [name, secs, tokens, mode, result] = s;
    const skipped = mode === "skipped";
    const isDone = skipped ? st.stageIdx >= i : (st.done || st.stageIdx > i || (st.stageIdx===i && st.finished));
    const isRunning = !skipped && st.running && st.stageIdx === i && !st.finished;
    const cls = skipped ? "skipped" : (isDone || st.finished ? "done" : (isRunning ? "running" : ""));
    const icon = skipped ? "\u2013" : (isDone || st.finished ? "\u2713" : (isRunning ? "\u22ef" : (i+1)));
    return `
    <div class="stage ${cls}">
      <div class="stage-icon">${icon}</div>
      <div>
        <div class="stage-name">${esc(name)}</div>
        <div class="stage-result">${(isDone||st.finished||skipped) ? esc(result) : (isRunning?'Working\u2026':'Queued')}</div>
      </div>
      <div class="stage-meta">${skipped?'skipped':(mode+' \u00b7 '+secs+'s \u00b7 '+tokens+' tok')}</div>
    </div>`;
  }).join("");
}

function formFieldDefs(c){
  const t=c.therapy, p=c.patient, pa=c.payer, dr=c.prescriber, dx=c.dx;
  const all = [
    ["Patient name", p.name], ["Date of birth", p.dob], ["Member ID", pa.memberId],
    ["Group number", pa.group], ["Diagnosis (ICD-10)", `${dx.text} (${dx.code})`],
    ["Prescriber name", dr.name], ["Prescriber NPI", dr.npi], ["Prescriber specialty", dr.specialty],
    ["Requested drug", `${t.brand} (${t.generic})`], ["Strength / dose", `${t.strength} \u2014 ${t.dose}`],
    ["Route", t.route], ["Frequency", t.frequency], ["Quantity", t.quantity],
    ["Days supply", t.daysSupply], ["Site of care", t.siteOfCare], ["Request type", t.requestType]
  ];
  return all.slice(0, c.form.fields || 0);
}

function renderForm(c, st){
  if(!c.form.completed){
    return `<p class="muted small">${esc(c.form.name)}</p>`;
  }
  const defs = formFieldDefs(c);
  return `<div class="form-grid">${defs.map((d,i)=>{
    const filled = st.finished || st.filledFields > i;
    const typing = !st.finished && st.running && st.filledFields === i;
    return `<div class="field"><label>${esc(d[0])}</label><div class="val ${typing?'typing':''}">${filled?esc(d[1]):''}</div></div>`;
  }).join("")}</div>`;
}

function renderQuestions(c, st){
  return c.questions.map((q,i)=>{
    const revealed = st.finished || st.revealedQ > i;
    if(!revealed){
      return `<div class="qa"><div class="q">${esc(q.q)}</div><div class="a muted">Pending\u2026</div></div>`;
    }
    const missing = q.a === null;
    return `<div class="qa">
      <div class="q">${esc(q.q)}</div>
      <div class="a ${missing?'missing':''}">${missing ? 'Not on file' : esc(q.a)}</div>
      <div class="meta">
        ${q.src ? `<span class="cite-tag">${esc(q.src)}${q.page?' p.'+q.page:''}</span>` : (missing?'':'<span class="cite-tag">Policy</span>')}
        ${q.conf==='low' ? '<span class="pill pill-low">Low confidence</span>' : ''}
        <span>${esc(q.why)}</span>
      </div>
    </div>`;
  }).join("");
}

function renderDocuments(c){
  return c.documents.map(d=>{
    const isPolicy = d.cite === "POL";
    const title = isPolicy ? c.policy.id : d.label;
    const sub = isPolicy ? "payer medical policy" : `${d.cite} \u00b7 ${d.kind} \u00b7 ${d.size}`;
    return `
    <div class="doc-row">
      <div class="doc-icon ${isPolicy?'doc-icon-policy':''}">${isPolicy?'POL':'PDF'}</div>
      <div class="doc-info">
        <div class="doc-label">${esc(title)}</div>
        <div class="doc-sub">${esc(sub)}</div>
      </div>

        <a class="btn btn-sm btn-ghost" href="${esc(d.file)}" download>Download</a>

}

  </div></div>`;
}

/* ---------------- agent run controller ---------------- */
function runAgent(id){
  const c = CASES[id];
  const st = runState(id);
  if(st.running || st.finished) return;
  st.running = true; st.stageIdx = 0; st.done = false;
  render();
  stepStage(id, 0);
}

function stepStage(id, idx){
  const c = CASES[id];
  const st = runState(id);
  if(idx >= c.stages.length){
    st.running = false; st.finished = true; st.done = true;
    render();
    setTimeout(()=>{
      const b = document.getElementById("btn-primary-action");
      if(b) b.addEventListener("click", ()=>{ st.primaryDone = true; render(); toast("Case advanced: "+c.primaryAction); });
    }, 0);
    return;
  }
  st.stageIdx = idx;
  const [name, secs, tokens, mode] = c.stages[idx];

  /* progressively reveal questions during the questionnaire stage,
     and progressively fill fields during the form stage */
  if(name === "Answer PA questionnaire" && mode !== "skipped"){
    animateList(id, "revealedQ", c.questions.length, Math.max(secs*1000, 400));
  }
  if(name === "Complete payer form" && mode !== "skipped" && c.form.completed){
    animateList(id, "filledFields", formFieldDefs(c).length, Math.max(secs*1000, 400));
  }

  render();
  const dwell = mode === "skipped" ? 250 : Math.max(secs*1000, 500);
  setTimeout(()=>stepStage(id, idx+1), dwell);
}

function animateList(id, key, count, totalMs){
  const st = runState(id);
  st[key] = 0;
  if(count<=0) return;
  const step = Math.max(totalMs / count, 120);
  let i=0;
  const tick = ()=>{
    i++; st[key] = i;
    const rerenderTarget = key==="revealedQ" ? "qa-panel" : "form-panel";
    const el = document.getElementById(rerenderTarget);
    const c = CASES[id];
    if(el) el.innerHTML = key==="revealedQ" ? renderQuestions(c, st) : renderForm(c, st);
    const pipe = document.getElementById("pipeline");
    if(pipe) pipe.innerHTML = renderStages(c, st);
    if(i<count) setTimeout(tick, step);
  };
  setTimeout(tick, step);
}

/* ================================================================

   ================================================================ */
function renderCRM(hash){
  const m = hash.match(/^\/crm\/([A-Za-z0-9-]+)(?:\/(\w+))?/);
  const activeId = m ? m[1] : ORDER[0];
  const activeTab = (m && m[2]) || "overview";
  const c = CASES[activeId];

  const side = ORDER.map(id=>{
    const cc = CASES[id];
    return `<a class="${id===activeId?'active':''}" href="#/crm/${id}/${activeTab}">${id}<div class="small muted">${esc(cc.patient.name)}</div></a>`;
  }).join("");

  const tabs = ["overview","documents","labs","notes"];
  const tabBar = tabs.map(t=>`<button data-tab="${t}" class="${t===activeTab?'active':''}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("");

  let body = "";
  if(activeTab === "documents"){
    body = renderDocuments(c);
  } else if(activeTab === "labs"){
    body = `<table><thead><tr><th class="small muted">Test</th><th class="small muted">Result</th><th class="small muted">Range</th><th class="small muted">Collected</th></tr></thead>
      <tbody>${c.labs.map(l=>`<tr><td class="small">${esc(l[0])}</td><td class="small">${esc(l[1])}</td><td class="small muted">${esc(l[2])}</td><td class="small muted">${esc(l[3])}</td></tr>`).join("")}</tbody></table>`;
  } else if(activeTab === "notes"){
    body = `<div class="assessment ${verdictClass(c.assessment.verdict)}"><h3>${esc(c.assessment.title)}</h3><p>${esc(c.assessment.body)}</p></div>`;
  } else {
    body = `<dl class="kv">
      <dt>Patient</dt><dd>${esc(c.patient.name)}, ${c.patient.age}${c.patient.sex} \u00b7 ${esc(c.patient.phone)}</dd>
      <dt>Address</dt><dd>${esc(c.patient.address)}</dd>
      <dt>Diagnosis</dt><dd>${esc(c.dx.full)}</dd>
      <dt>Therapy</dt><dd>${esc(c.therapy.brand)} (${esc(c.therapy.generic)}) \u2014 ${esc(c.therapy.label)}</dd>
      <dt>Prescriber</dt><dd>${esc(c.prescriber.name)}, ${esc(c.prescriber.practice)}</dd>
      <dt>Payer</dt><dd>${esc(c.payer.name)} \u00b7 ${esc(c.payer.memberId)}</dd>
      <dt>Scenario</dt><dd>${badgeFor(c.scenario)}</dd>
    </dl>`;
  }

  app.innerHTML = `
    ${topbar('crm')}
    <div class="container">
      <h1 class="page-title">Northstar Hub Case Manager</h1>
      <p class="page-sub">Clinical source system \u2014 read-only view of referral data.</p>
      <div class="crm-layout">
        <div class="crm-side">${side}</div>
        <div class="panel">
          <div class="panel-body">
            <div class="crm-tabs">${tabBar}</div>
            ${body}
          </div>
        </div>
      </div>
    </div>`;

  document.querySelectorAll(".crm-tabs button").forEach(b=>{
    b.addEventListener("click", ()=>{ location.hash = `#/crm/${activeId}/${b.dataset.tab}`; });
  });
}

/* ================================================================
   EXPORT TO RPA QUEUE (Supabase Edge Function -> UiPath Orchestrator)
   ================================================================ */
let _supaClient = null;
function getSupabase(){
  const cfg = window.SUPABASE_CONFIG || {};
  if(!cfg.url || !cfg.anonKey) return null;
  if(!window.supabase || !window.supabase.createClient) return null;
  if(!_supaClient) _supaClient = window.supabase.createClient(cfg.url, cfg.anonKey);
  return _supaClient;
}

/* ---------------- db row <-> in-page case shape ---------------- */
/* hub_case columns are snake_case (case_id, primary_action); every view
   in this file reads the camelCase shape documented in the README
   (id, primaryAction, ...), so rows coming back from Supabase are
   translated once, here, on the way in. */
function rowToCase(row){
  return {
    id: row.case_id, scenario: row.scenario, received: row.received,
    runtime: row.runtime, baseline: row.baseline, flags: row.flags,
    primaryAction: row.primary_action,
    patient: row.patient, payer: row.payer, therapy: row.therapy, dx: row.dx,
    prescriber: row.prescriber, policy: row.policy, form: row.form,
    documents: row.documents || [], criteria: row.criteria || [],
    questions: row.questions || [], packet: row.packet || [],
    stages: row.stages || [], assessment: row.assessment,
    submission: row.submission, labs: row.labs || []
  };
}

/* ---------------- load: replace the bundled data.js cases with the
   live table, if Supabase is configured ---------------- */
async function loadCasesFromSupabase(){
  const client = getSupabase();
  if(!client) return; // stay on the bundled assets/data.js content
  try{
    const { data, error } = await client.functions.invoke("case-crud-hub", { body: { action: "list" } });
    if(error) throw new Error(error.message || "list failed");
    if(!data || data.success === false) throw new Error((data && data.error) || "list failed");
    const rows = data.cases || [];
    if(!rows.length) return; // empty table -> keep the bundled demo cases visible

    // wipe and repopulate in place so existing references (CASES, ORDER) stay valid
    ORDER.length = 0;
    Object.keys(CASES).forEach(k=>delete CASES[k]);
    rows.forEach(r=>{
      const c = rowToCase(r);
      CASES[c.id] = c;
      ORDER.push(c.id);
    });
  }catch(err){
    console.warn("Could not load cases from Supabase, using bundled data.js instead:", err.message);
  }
}

/* ---------------- new-case defaults ---------------- */
/* Fills in every NOT NULL column on hub_case with a sensible empty
   value, so a quick 6-field form on the portal is still enough to
   create a valid row -- the rest can be filled in later, or the case
   just sits in the queue unrun until someone opens it and clicks
   Run agent. */
function blankCaseRow(fields){
  const now = new Date().toISOString();
  return {
    scenario: fields.scenario || "UPDATE",
    received: now, runtime: "", baseline: "", flags: 0,
    primaryAction: "Review",
    patient: { name: fields.patientName, age: Number(fields.age)||null, dob: "", sex: fields.sex||"", pid: "", phone: "", address: "" },
    payer: { name: fields.payerName, short: fields.payerName, plan: "", memberId: "", group: "", effective: "", benefit: "" },
    therapy: { brand: fields.brand||"", generic: fields.generic||"", label: "", cls: "", jcode: "", ndc: "", dose: "", route: "", frequency: "", quantity: "", daysSupply: "", siteOfCare: "", duration: "", requestType: "Initial", startDate: "", strength: "" },
    dx: { code: fields.dxCode||"", text: fields.dxText||"", full: fields.dxText||"", severity: "" },
    prescriber: { name: "", npi: "", specialty: "", practice: "", phone: "", fax: "", tin: "" },
    policy: { id: "", title: "", effective: "", rev: "" },
    form: { name: "Pending", id: null, rev: null, fields: 0, completed: false },
    documents: [], criteria: [], questions: [], packet: [],
    stages: [
      ["Ingest referral", 1, 250, "local", "Referral parsed"],
      ["Extract clinical data", 2, 500, "local", "Manually entered, not yet reviewed"],
      ["Match payer & policy", 1, 100, "cache", "Policy not yet matched"],
      ["Generate assessment", 1, 150, "local", "Awaiting review"]
    ],
    assessment: { verdict: "update", title: "Awaiting review", body: "This referral was added manually and has not been run through the agent yet." },
    submission: { headline: "Not yet submitted", tracking: "", status: "New", reviewer: "", channel: "" },
    labs: []
  };
}

async function createCase(fields){
  const client = getSupabase();
  const row = blankCaseRow(fields);
  if(!client){
    /* local-only fallback: fabricate an id and add straight to memory */
    const nextNum = 2040 + ORDER.length + 1;
    row.id = "HUB-" + nextNum;
    CASES[row.id] = row;
    ORDER.push(row.id);
    return row;
  }
  const { data, error } = await client.functions.invoke("case-crud-hub", { body: { action: "create", data: row } });
  if(error) throw new Error(error.message || "create failed");
  if(!data || data.success === false) throw new Error((data && data.error) || "create failed");
  const c = rowToCase(data.case);
  CASES[c.id] = c;
  ORDER.push(c.id);
  return c;
}

async function deleteCase(caseId){
  const client = getSupabase();
  if(!client){
    delete CASES[caseId];
    const idx = ORDER.indexOf(caseId);
    if(idx>-1) ORDER.splice(idx,1);
    delete RUN[caseId];
    return;
  }
  const { data, error } = await client.functions.invoke("case-crud-hub", { body: { action: "delete", caseId } });
  if(error) throw new Error(error.message || "delete failed");
  if(!data || data.success === false) throw new Error((data && data.error) || "delete failed");
  delete CASES[caseId];
  const idx = ORDER.indexOf(caseId);
  if(idx>-1) ORDER.splice(idx,1);
  delete RUN[caseId];
}

const RPA_QUEUE_NAME = "SpecialtyDrugPatientData";

async function exportToQueue(caseId, btn){
  if(!btn) return;
  const original = btn.textContent;
  btn.disabled = true; btn.classList.add("is-loading"); btn.textContent = "Sending\u2026";

  const client = getSupabase();
  try{
    let result;
    if(client){
      const { data, error } = await client.functions.invoke("export-to-uipath", {
        body: { caseId, queue: RPA_QUEUE_NAME }
      });
      if(error) throw new Error(error.message || "Edge function error");
      if(data && data.success === false) throw new Error(data.error || "Export failed");
      result = data;
    } else {
      /* No Supabase configured — simulate locally so the demo is end-to-end demoable */
      await new Promise(r=>setTimeout(r, 900));
      result = { success:true, queueItemId: Math.floor(100000+Math.random()*900000), simulated:true };
    }
    btn.classList.remove("is-loading"); btn.classList.add("is-done");
    btn.textContent = "Sent \u2713";
    toast(result.simulated
      ? `[Simulated] Queued to ${RPA_QUEUE_NAME}. Item #${result.queueItemId}`
      : `Sent to ${RPA_QUEUE_NAME}. Queue item #${result.queueItemId}`, "success");
    setTimeout(()=>{ btn.disabled=false; btn.classList.remove("is-done"); btn.textContent = original; }, 3000);
  } catch(err){
    btn.disabled = false; btn.classList.remove("is-loading"); btn.textContent = original;
    toast("Export failed: " + err.message, "error");
  }
}

})();
